# ROSbot导航训练配置

training:
  algorithms:
    - "td3"
  
  base_params:
    learning_rate: 0.0003
    buffer_size: 500000
    learning_starts: 5000
    batch_size: 256
    gamma: 0.99
    tau: 0.005
    policy_delay: 2
    target_policy_noise: 0.2
    target_noise_clip: 0.5
    train_freq: 1
    gradient_steps: 1
  
  cargo_type_params:
    normal:
      max_linear_velocity: 2.0
      max_angular_velocity: 2.0
      stability_penalty: 0.0
      speed_constraint: 0
    
    fragile:
      max_linear_velocity: 1.0  # 易碎品限速
      max_angular_velocity: 1.5  
      stability_penalty: -5.0
      speed_constraint: 1
      min_linear_velocity: 0.2
      max_acceleration: 0.5
    
    dangerous:
      max_linear_velocity: 0.8  # 危险品更限速
      max_angular_velocity: 1.0
      stability_penalty: -2.0
      safety_distance: 0.5  # 安全距离
      speed_constraint: 2
      min_linear_velocity: 0.1
      max_acceleration: 0.3

localization:
  amcl:
    num_particles: 800
    
    initial_std: [0.2, 0.2, 0.15, 0.05, 0.05, 0.1]  # [x,y,z,roll,pitch,yaw]
    
    motion_noise_params:
      alpha1: 0.1    # 旋转误差系数
      alpha2: 0.01   # 平移误差系数
      alpha3: 0.1    # 旋转误差系数
      alpha4: 0.01   # 平移误差系数
    
    measurement_noise:
      sigma_hit: 0.05    # 测量噪声
      z_rand: 0.05       # 随机测量概率
      z_max: 0.05        # 最大距离概率
      z_short: 0.01      # 短测量概率
    
    # 自适应重采样参数
    adaptive_resampling:
      alpha_slow: 0.001
      alpha_fast: 0.1
      resample_threshold: 0.5  # 有效样本比例阈值
  
  # GPS+IMU备份定位
  backup_localization:
    process_noise: 0.01
    measurement_noise: 0.02
    low_pass_alpha: 0.1

environment:
  # Webots环境参数
  rosbot_params:
    wheel_base: 0.235        # 轴距 (m)
    wheel_radius: 0.08       # 轮径 (m)
    max_wheel_speed: 6.28    # 最大轮速 (rad/s)
    motor_step: 0.032        # 基础时间步 (s)
  
  # 传感器参数
  sensor_params:
    lidar:
      horizontal_resolution: 20
      field_of_view: 1.7453   # 100度
      max_range: 10.0
      noise_std: 0.05
      use_point_cloud: true
    
    gps:
      accuracy: 0.05          # +/-5cm 精度
      noise_density: 0.01
      update_rate: 20         # Hz
    
    imu:
      roll_pitch_accuracy: 0.02    # +/-0.02 rad
      yaw_accuracy: 0.03           # +/-0.03 rad
      noise_density: 0.01
      update_rate: 50              # Hz
  
  # 环境边界
  workspace_bounds:
    x_range: [-20, 20]
    y_range: [-15, 15] 
    z_range: [-2, 2]
  
  # 成功标准
  success_criteria:
    position_threshold: 0.15     # 到达目标位置阈值 (m)
    heading_threshold: 0.2       # 航向偏差阈值 (rad)
    success_reward: 500.0
    collision_penalty: -100.0
    time_penalty: -0.1
  
  # 训练参数
  training_params:
    max_episode_steps: 400
    collision_threshold: 0.05    # 碰撞检测阈值 (m)
    min_obstacle_distance: 0.2   # 最小安全距离 (m)
    stability_threshold: 0.1     # 稳定性阈值 (加速度)

curriculum_learning:
  # 课程学习配置
  stages:
    - name: "初始阶段"
      uncertainty_level: 0.1
      duration: 50000
      description: "低不确定性训练，建立基础导航能力"
    
    - name: "能力提升"  
      uncertainty_level: 0.3
      duration: 100000
      description: "中等不确定性，提高鲁棒性"
    
    - name: "高级阶段"
      uncertainty_level: 0.6
      duration: 150000
      description: "高不确定性测试，适应复杂情况"
    
    - name: "鲁棒性验证"  
      uncertainty_level: 0.9
      duration: 100000
      description: "极端不确定性，验证系统稳定性"

mlflow:
  tracking_uri: "./mlruns"
  experiment_prefix: "rosbot_navigation"
  
  tracking_metrics:
    - "episode_reward"
    - "success_rate" 
    - "avg_steps"
    - "collision_rate"
    - "amcl_position_uncertainty"
    - "amcl_convergence_rate"
    - "training_progress"
  
  tracking_params:
    - "algorithm"
    - "cargo_type"
    - "total_steps"
    - "learning_rate"
    - "buffer_size"
    - "batch_size"

logging:
  level: "INFO"
  file_path: "./logs/navigation.log"
  file_level: "DEBUG"
  max_size: "10MB"
  backup_count: 5
  
  external_integrations:
    tensorboard: true
    mlflow: true
    wandb: false